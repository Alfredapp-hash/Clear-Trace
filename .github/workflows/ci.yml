# Unit-test gate for pull requests and pushes to main.
# Playwright is not in this workflow: playwright.config.ts starts `npm run
# dev` (a live Next.js server) and installs Chromium, which is not a cheap
# secret-free smoke job.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # /skills is gitignored and generated from agent-builder/skillpack.
      # registry tests call loadSkillRegistry(), which requires that directory.
      - name: Sync skill pack
        run: node scripts/sync-skills.js

      - name: Run unit tests
        run: npm test
        env:
          CI: true
