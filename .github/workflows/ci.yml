name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every third-party action is pinned to a full commit SHA (tag in the trailing comment).
# Dependabot (github-actions ecosystem) keeps the SHAs and comments current.

jobs:
  check:
    name: Audit, lint, typecheck, test (coverage), build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production dependencies (blocks on high/critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Data broker registry JSON (CPPA, Oregon, Texas) matches the checked-in snapshots
        run: npx tsx scripts/import-cppa-registry.ts --check && npx tsx scripts/import-state-registries.ts --check
      - name: Unit + integration tests with coverage gate
        run: npm run test:coverage
      - name: Coverage summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          node -e '
            const s = require("./coverage/coverage-summary.json");
            const root = process.cwd() + "/";
            const groups = { "src/lib": {}, "src/app/api": {}, "total": {} };
            const keys = ["statements", "branches", "functions", "lines"];
            for (const g of Object.keys(groups)) for (const k of keys) groups[g][k] = [0, 0];
            for (const [file, m] of Object.entries(s)) {
              if (file === "total") continue;
              const rel = file.replace(root, "");
              for (const g of ["src/lib", "src/app/api"]) {
                if (!rel.startsWith(g + "/")) continue;
                for (const k of keys) { groups[g][k][0] += m[k].covered; groups[g][k][1] += m[k].total; }
              }
            }
            for (const k of keys) groups.total[k] = [s.total[k].covered, s.total[k].total];
            const pct = ([c, t]) => (t ? ((100 * c) / t).toFixed(1) : "100.0") + "%";
            const rows = Object.entries(groups).map(([g, m]) => `| ${g} | ${keys.map((k) => pct(m[k])).join(" | ")} |`);
            console.log(["### Coverage", "", "| Scope | Statements | Branches | Functions | Lines |", "|---|---|---|---|---|", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Build
        run: npm run build
      - name: Standalone output ships no sharp / libvips
        run: |
          set -euo pipefail
          test -d .next/standalone
          if [ -e .next/standalone/node_modules/@img ] || [ -e .next/standalone/node_modules/sharp ]; then
            echo "sharp/@img leaked into .next/standalone" >&2
            exit 1
          fi
      - name: Browser bundles carry no zod or broker catalog
        # zod's eval probe trips the production CSP; the catalog is 500+ server-only entries.
        run: |
          set -euo pipefail
          if grep -rlE 'return Function\(""\)|"relistIntervalDays"' .next/static; then
            echo "zod or the broker catalog leaked into a client bundle (see files above)" >&2
            exit 1
          fi

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Build
        run: npm run build
      - run: npx playwright install --with-deps chromium
      # Runs against the standalone production build (production CSP and cookies), not the
      # dev server. playwright.config.ts starts it with REGISTRATION_MODE=open (the suite
      # registers several accounts).
      - name: Playwright against the production build
        env:
          E2E_SERVER: prod
        run: npx playwright test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Production image: smoke, backup -> wipe -> restore, then the Playwright suite against the
  # container. Blocks merges as a required status check; the job name is kept from v1.3 so
  # existing branch-protection rules keep matching it.
  docker:
    name: Docker Compose smoke
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Generate throwaway secrets
        run: |
          {
            echo "SESSION_SECRET=$(openssl rand -base64 48)"
            echo "ENCRYPTION_KEY=$(openssl rand -base64 48)"
            echo "WORKER_SECRET=$(openssl rand -base64 48)"
            echo "BACKUP_PASSPHRASE=$(openssl rand -base64 48)"
          } > .env
      - name: Compose refuses to start without secrets
        run: |
          if env -i PATH="$PATH" HOME="$HOME" docker compose --env-file /dev/null config >/dev/null 2>&1; then
            echo "compose accepted missing secrets" >&2; exit 1
          fi
      - name: Images are pinned by digest
        run: |
          set -uo pipefail
          if grep -E '^(FROM |# syntax=)' Dockerfile | grep -v '@sha256:'; then
            echo "Dockerfile has an image without a digest" >&2; exit 1
          fi
          if grep -E '^\s*image:' docker-compose.yml | grep -v '@sha256:'; then
            echo "docker-compose.yml has an image without a digest" >&2; exit 1
          fi
      - name: Build and start (waits for healthcheck)
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Published on loopback only
        run: |
          set -euo pipefail
          docker compose port cleartrace 3000 | tee /dev/stderr | grep -qx '127.0.0.1:3000'
      # Runs with the shipped defaults (REGISTRATION_MODE=first_user): the smoke only needs
      # one account, and it asserts that a fresh install allows exactly one self-registration.
      - name: Health, auth, registration lock and persistence
        run: |
          set -euo pipefail
          B=http://127.0.0.1:3000
          curl -fsS $B/api/health | tee /dev/stderr | grep -q '"db":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' $B/api/cases)" = "401"
          curl -fsS -c jar -H 'content-type: application/json' \
            -d '{"name":"CI","email":"ci@test.local","password":"ci-pass-123456"}' $B/api/auth/register >/dev/null
          curl -fsS -b jar $B/api/auth/me | grep -q ci@test.local
          second=$(curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' \
            -d '{"name":"CI2","email":"ci2@test.local","password":"ci-pass-123456"}' $B/api/auth/register)
          test "$second" = "403"
          docker compose restart cleartrace
          docker compose up -d --wait --wait-timeout 120
          curl -fsS -b jar $B/api/auth/me | grep -q ci@test.local
      - name: Image optimizer is disabled
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3000/_next/image?url=/icon-192.png&w=64&q=75')
          echo "/_next/image -> $code"
          case "$code" in 400|404) ;; *) exit 1 ;; esac
      - name: Cron endpoints reject missing secret, accept worker secret
        run: |
          set -euo pipefail
          source .env
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/cron/verify)" = "401"
          curl -fsS -H "Authorization: Bearer $WORKER_SECRET" http://127.0.0.1:3000/api/cron/verify >/dev/null
          curl -fsS --max-time 900 -X POST -H "Authorization: Bearer $WORKER_SECRET" http://127.0.0.1:3000/api/worker/run >/dev/null
      - name: Image contains no database and no sharp
        run: |
          IMAGE=$(docker compose images cleartrace --format json | jq -r '.[0].Repository + ":" + .[0].Tag')
          test "$(docker run --rm --entrypoint ls "$IMAGE" -A /app/data)" = "backups"
          test -z "$(docker run --rm --entrypoint ls "$IMAGE" -A /app/data/backups)"
          docker run --rm --entrypoint sh "$IMAGE" -c 'test ! -e /app/node_modules/@img && test ! -e /app/node_modules/sharp'
          docker run --rm --entrypoint sh "$IMAGE" -c 'test -f /app/scripts/backup.mjs && test -f /app/scripts/restore.mjs && test -f /app/scripts/check-key.mjs'
      - name: Add a case with an encrypted identity claim
        run: |
          set -euo pipefail
          B=http://127.0.0.1:3000
          O="Origin: $B"
          CASE_ID=$(curl -fsS -b jar -H "$O" -H 'content-type: application/json' \
            -d '{"title":"CI backup case","caseType":"personal_exposure","targetRelationship":"self"}' \
            $B/api/cases | jq -r .caseId)
          test -n "$CASE_ID" && test "$CASE_ID" != null
          curl -fsS -b jar -H "$O" -H 'content-type: application/json' \
            -d '{"claims":[{"claimType":"full_name","value":"Casey Backup"}]}' \
            "$B/api/cases/$CASE_ID/identity-claims" >/dev/null
          curl -fsS -b jar "$B/api/cases/$CASE_ID" | jq -e '.identityClaims[0].redactedPreview | startswith("Ca") and endswith("up")'
          echo "CASE_ID=$CASE_ID" >> "$GITHUB_ENV"
      - name: Backup inside the running container
        run: |
          set -euo pipefail
          docker compose exec -T cleartrace node scripts/backup.mjs | tee backup.log
          grep -q '"event":"backup.created"' backup.log
          if grep -q 'Casey' backup.log; then echo "backup log leaked claim text" >&2; exit 1; fi
          rm -rf ci-backups && docker compose cp cleartrace:/app/data/backups ci-backups
          ls -l ci-backups
          BACKUP_FILE=$(ls ci-backups | grep -E '^cleartrace-.*\.db\.enc$' | sort | tail -1)
          test -n "$BACKUP_FILE"
          head -c 5 "ci-backups/$BACKUP_FILE" | grep -q CTBK1
          # Readable by the image's non-root user when bind-mounted below.
          chmod -R a+rX ci-backups
          echo "BACKUP_FILE=$BACKUP_FILE" >> "$GITHUB_ENV"
      - name: Restore refuses while the app is running (lock on the shared volume)
        run: |
          # The runner's bash uses -e; this step expects a non-zero exit.
          set +e
          docker compose run --rm --no-deps -T -v "$PWD/ci-backups:/restore:ro" cleartrace \
            node scripts/restore.mjs "/restore/$BACKUP_FILE"
          code=$?
          echo "restore exit code while running: $code"
          test "$code" = "3"
      - name: Wipe (down -v) and restore into a fresh volume
        run: |
          set -euo pipefail
          docker compose down -v
          if docker volume ls --format '{{.Name}}' | grep -q 'cleartrace-data$'; then
            echo "volume survived down -v" >&2; exit 1
          fi
          # Wrong ENCRYPTION_KEY: refused, nothing written to the fresh volume.
          if docker compose run --rm --no-deps -T -e ENCRYPTION_KEY=not-the-right-key-0123456789abcdef0123 \
               -v "$PWD/ci-backups:/restore:ro" cleartrace node scripts/restore.mjs "/restore/$BACKUP_FILE"; then
            echo "restore accepted a wrong ENCRYPTION_KEY" >&2; exit 1
          fi
          docker compose run --rm --no-deps -T --entrypoint sh cleartrace -c 'test ! -e /app/data/cleartrace.db'
          # Real restore.
          docker compose run --rm --no-deps -T -v "$PWD/ci-backups:/restore:ro" cleartrace \
            node scripts/restore.mjs "/restore/$BACKUP_FILE" | tee restore.log
          grep -q '"event":"restore.completed"' restore.log
          docker compose run --rm --no-deps -T cleartrace node scripts/check-key.mjs /app/data/cleartrace.db
      - name: Restored instance serves the old session and decrypts the claim
        run: |
          set -euo pipefail
          docker compose up -d --wait --wait-timeout 180
          B=http://127.0.0.1:3000
          curl -fsS -b jar $B/api/auth/me | grep -q ci@test.local
          curl -fsS -b jar "$B/api/cases/$CASE_ID" | tee case.json | jq -e '.identityClaims | length == 1'
          jq -e '.identityClaims[0].redactedPreview | startswith("Ca") and endswith("up")' case.json
          curl -fsS $B/api/health | grep -q '"db":"ok"'
      # The single-registration assertion above ran with the shipped default (first_user).
      # The Playwright suite registers several accounts, so switch to open registration now.
      - name: Restart with REGISTRATION_MODE=open for e2e
        run: REGISTRATION_MODE=open docker compose up -d --wait --wait-timeout 180
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright against the production container
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-docker
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Logs
        if: always()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v
