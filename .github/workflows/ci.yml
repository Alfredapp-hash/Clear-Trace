name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit + integration tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Docker Compose smoke
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Generate throwaway secrets
        run: |
          {
            echo "SESSION_SECRET=$(openssl rand -base64 48)"
            echo "ENCRYPTION_KEY=$(openssl rand -base64 48)"
            echo "WORKER_SECRET=$(openssl rand -base64 48)"
          } > .env
      - name: Compose refuses to start without secrets
        run: |
          if env -i PATH="$PATH" HOME="$HOME" docker compose --env-file /dev/null config >/dev/null 2>&1; then
            echo "compose accepted missing secrets" >&2; exit 1
          fi
      - name: Build and start (waits for healthcheck)
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Health, auth and persistence
        run: |
          set -euo pipefail
          B=http://localhost:3000
          curl -fsS $B/api/health | tee /dev/stderr | grep -q '"db":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' $B/api/cases)" = "401"
          curl -fsS -c jar -H 'content-type: application/json' \
            -d '{"name":"CI","email":"ci@test.local","password":"ci-pass-123456"}' $B/api/auth/register >/dev/null
          curl -fsS -b jar $B/api/auth/me | grep -q ci@test.local
          docker compose restart cleartrace
          docker compose up -d --wait --wait-timeout 120
          curl -fsS -b jar $B/api/auth/me | grep -q ci@test.local
      - name: Cron endpoints reject missing secret, accept worker secret
        run: |
          set -euo pipefail
          source .env
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/cron/verify)" = "401"
          curl -fsS -H "Authorization: Bearer $WORKER_SECRET" http://localhost:3000/api/cron/verify >/dev/null
      - name: Image contains no database
        run: |
          IMAGE=$(docker compose images cleartrace --format json | jq -r '.[0].Repository + ":" + .[0].Tag')
          test -z "$(docker run --rm --entrypoint ls "$IMAGE" -A /app/data)"
      - name: Logs
        if: always()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v
